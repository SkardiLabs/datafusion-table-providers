name: PostgreSQL client socket options

on:
  pull_request:
    branches:
      - skardi/v0.11.2

permissions:
  contents: read

concurrency:
  group: postgres-socket-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  postgres-socket-options:
    name: PostgreSQL socket configuration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Check PostgreSQL provider
        run: cargo check -p datafusion-table-providers --locked --no-default-features --features postgres
      - name: Verify native socket options preserve connection identity
        shell: bash
        run: |
          cargo test -p datafusion-table-providers --locked --no-default-features --features postgres,datafusion/parquet --lib sql::db_connection_pool::postgrespool::tests::parse_connection_string_without_password -- --exact --nocapture | tee "$RUNNER_TEMP/postgres-socket-options-test.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/postgres-socket-options-test.log"
